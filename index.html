<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多伦多超市特价 · Flyer 搜索</title>

<!-- 浏览器标签页图标 -->
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">

<!-- iOS "添加到主屏幕" 用这个 -->
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flyer特价">

<!-- Android / Chrome PWA 用 -->
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#16302A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Noto+Sans+SC:wght@400;600;800&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #16302A;
    --bg-soft: #1D3C33;
    --card: #FBF3E3;
    --card-line: #E3D7BB;
    --ink: #1F2B24;
    --ink-soft: #5B6B60;
    --cream: #F5EFE0;
    --green: #4A7862;
    --green-bright: #7FBE9A;
    --red: #E1483C;
    --gold: #F2B705;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    background-image:
      radial-gradient(circle at 15% 8%, rgba(242,183,5,0.08), transparent 40%),
      radial-gradient(circle at 90% 20%, rgba(225,72,60,0.08), transparent 35%);
    font-family:'Inter','Noto Sans SC',sans-serif;
    color:var(--cream);
  }
  h1,h2,h3,.display{
    font-family:'Archivo Black','Noto Sans SC',sans-serif;
  }

  /* ---------- Header ---------- */
  header{
    padding:48px 24px 28px;
    text-align:center;
    border-bottom:1px dashed rgba(245,239,224,0.25);
  }
  .eyebrow{
    font-family:'Roboto Mono',monospace;
    letter-spacing:.18em;
    text-transform:uppercase;
    font-size:12px;
    color:var(--green-bright);
    margin-bottom:14px;
  }
  header h1{
    font-size:clamp(28px,5vw,46px);
    line-height:1.15;
    margin:0 0 10px;
  }
  header h1 span{color:var(--gold);}
  header p{
    color:var(--card-line);
    font-size:15px;
    max-width:520px;
    margin:0 auto;
  }

  /* ---------- Search ---------- */
  .search-wrap{
    max-width:720px;
    margin:32px auto 0;
    padding:0 24px;
  }
  .search-box{
    position:relative;
    background:var(--card);
    border-radius:14px;
    box-shadow:0 14px 0 rgba(0,0,0,0.18);
    padding:6px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .search-box input{
    flex:1;
    min-width:0;
    border:none;
    background:transparent;
    outline:none;
    font-family:'Noto Sans SC','Inter',sans-serif;
    font-size:18px;
    font-weight:600;
    color:var(--ink);
    padding:14px 12px;
  }
  .search-box input::placeholder{color:var(--ink-soft); font-weight:500;}
  .search-box button{
    background:var(--red);
    color:#fff;
    border:none;
    border-radius:9px;
    padding:14px 22px;
    font-weight:700;
    font-family:'Noto Sans SC',sans-serif;
    cursor:pointer;
    flex-shrink:0;
    transition:transform .12s ease;
  }
  .search-box button:hover{transform:translateY(-2px);}
  .quick-tags{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    margin-top:16px;
  }
  .quick-tags button{
    background:transparent;
    border:1px solid rgba(245,239,224,0.35);
    color:var(--cream);
    border-radius:999px;
    padding:6px 16px;
    font-size:13px;
    font-family:'Noto Sans SC',sans-serif;
    cursor:pointer;
  }
  .quick-tags button:hover{border-color:var(--gold); color:var(--gold);}

  /* ---------- Category filters (toggle chips, same pattern as store chips) ---------- */
  .category-chip{
    border:1.5px solid var(--gold);
    color:var(--gold);
    background:rgba(255,255,255,0.03);
    border-radius:999px;
    padding:6px 14px;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    font-family:'Noto Sans SC',sans-serif;
    transition:all .12s ease;
  }
  .category-chip.active{
    background:var(--gold);
    color:var(--bg);
  }

  /* ---------- Sort select ---------- */
  .sort-select{
    background:var(--bg-soft);
    color:var(--cream);
    border:1px solid rgba(245,239,224,0.35);
    border-radius:8px;
    padding:6px 10px;
    font-size:12.5px;
    font-family:'Noto Sans SC',sans-serif;
    cursor:pointer;
  }
  .sort-select:hover{border-color:var(--gold);}

  /* ---------- Store filters ---------- */
  .stores{
    max-width:960px;
    margin:28px auto 0;
    padding:0 24px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
  }
  .store-chip{
    border:1.5px solid var(--chip-color,var(--green));
    color:var(--chip-color,var(--green-bright));
    background:rgba(255,255,255,0.03);
    border-radius:8px;
    padding:6px 12px;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    font-family:'Noto Sans SC',sans-serif;
    transition:all .12s ease;
  }
  .store-chip.active{
    background:var(--chip-color,var(--green));
    color:var(--bg);
  }
  .stores-header{
    max-width:960px;
    margin:20px auto 0;
    padding:0 24px;
    display:flex;
    gap:8px;
    justify-content:center;
  }
  .select-all-btn{
    background:transparent;
    border:1px solid var(--gold);
    color:var(--gold);
    border-radius:999px;
    padding:5px 14px;
    font-size:12px;
    font-weight:600;
    font-family:'Noto Sans SC',sans-serif;
    cursor:pointer;
  }
  .select-all-btn:hover{
    background:var(--gold);
    color:var(--bg);
  }

  /* ---------- Results ---------- */
  main{max-width:1100px; margin:0 auto; padding:36px 24px 80px;}
  .results-meta{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:18px;
    font-size:13px;
    color:var(--card-line);
    font-family:'Roboto Mono',monospace;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:20px;
  }
  .card{
    position:relative;
    background:var(--card);
    color:var(--ink);
    border-radius:4px;
    padding:18px 16px 16px;
    clip-path: polygon(
      0% 4px, 4px 0%, calc(100% - 4px) 0%, 100% 4px,
      100% calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 0% calc(100% - 4px)
    );
    border:1px solid var(--card-line);
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .card::before{
    content:"";
    position:absolute;
    top:14px; left:-7px;
    width:14px; height:14px;
    background:var(--bg);
    border-radius:50%;
    box-shadow: inset 0 0 0 1px var(--card-line);
  }
  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
  }
  .select-checkbox{
    width:20px;
    height:20px;
    border-radius:5px;
    border:2px solid var(--card-line);
    background:rgba(255,255,255,0.9);
    cursor:pointer;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    font-weight:900;
    color:transparent;
    transition:all .12s ease;
  }
  .select-checkbox:hover{border-color:var(--green);}
  .select-checkbox.checked{
    background:var(--green);
    border-color:var(--green);
    color:#fff;
  }

  /* ---------- Compare bar (fixed at bottom) ---------- */
  .compare-bar{
    position:fixed;
    bottom:0; left:0; right:0;
    background:var(--bg-soft);
    border-top:2px solid var(--gold);
    padding:12px 24px;
    display:none;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    z-index:100;
    box-shadow:0 -4px 20px rgba(0,0,0,0.35);
    font-family:'Noto Sans SC',sans-serif;
  }
  .compare-bar.visible{display:flex;}
  .compare-bar-count{color:var(--cream); font-size:14px; font-weight:600;}
  .compare-bar-actions{display:flex; gap:10px;}
  .compare-bar button{
    font-family:'Noto Sans SC',sans-serif;
    font-weight:700;
    font-size:13px;
    border-radius:8px;
    padding:8px 18px;
    cursor:pointer;
    border:none;
  }
  .compare-bar-view-btn{background:var(--gold); color:var(--bg);}
  .compare-bar-clear-btn{background:transparent; color:var(--cream); border:1px solid rgba(245,239,224,0.4) !important;}

  /* ---------- Compare modal ---------- */
  .compare-modal-overlay{
    position:fixed; inset:0;
    background:rgba(10,20,17,0.75);
    z-index:200;
    display:none;
    align-items:flex-start;
    justify-content:center;
    padding:40px 20px;
    overflow-y:auto;
  }
  .compare-modal-overlay.visible{display:flex;}
  .compare-modal{
    background:var(--card);
    color:var(--ink);
    border-radius:10px;
    max-width:1100px;
    width:100%;
    padding:24px;
    font-family:'Noto Sans SC',sans-serif;
  }
  .compare-modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
  }
  .compare-modal-header h2{margin:0; font-size:20px;}
  .compare-modal-close{
    background:none; border:none; cursor:pointer;
    font-size:22px; color:var(--ink-soft); line-height:1;
  }
  .compare-modal-close:hover{color:var(--red);}
  .compare-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));
    gap:16px;
  }
  .compare-item{
    border:1px solid var(--card-line);
    border-radius:8px;
    padding:12px;
    position:relative;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .compare-item-remove{
    position:absolute; top:6px; right:6px;
    background:rgba(255,255,255,0.9);
    border:none; border-radius:50%;
    width:22px; height:22px;
    cursor:pointer; font-size:14px; line-height:1;
    color:var(--red);
  }
  .compare-item-list-check{
    position:absolute; top:6px; left:6px;
    width:22px; height:22px;
    border-radius:50%;
    border:2px solid var(--card-line);
    background:rgba(255,255,255,0.9);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:900; color:transparent;
    z-index:2;
  }
  .compare-item-list-check.checked{
    background:var(--gold);
    border-color:var(--gold);
    color:var(--bg);
  }
  .compare-modal-actions{
    display:flex;
    justify-content:flex-end;
    margin-top:20px;
  }
  .generate-list-btn{
    font-family:'Noto Sans SC',sans-serif;
    font-weight:700;
    font-size:13px;
    background:var(--gold);
    color:var(--bg);
    border:none;
    border-radius:8px;
    padding:10px 20px;
    cursor:pointer;
  }
  .generate-list-btn:hover{filter:brightness(1.08);}

  /* ---------- Shopping list image modal ---------- */
  .shoplist-modal{
    background:var(--card);
    color:var(--ink);
    border-radius:10px;
    max-width:560px;
    width:100%;
    max-height:85vh;
    overflow-y:auto;
    padding:24px;
    font-family:'Noto Sans SC',sans-serif;
    text-align:left;
  }
  .shoplist-hint{
    font-size:13px;
    color:var(--ink-soft);
    margin:8px 0 16px;
  }
  .shoplist-date{
    font-size:12px;
    color:var(--ink-soft);
    font-family:'Roboto Mono',monospace;
    margin:0 0 16px;
  }
  .shoplist-rows{
    display:flex;
    flex-direction:column;
  }
  .shoplist-row{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 0;
    border-bottom:1px solid var(--card-line);
  }
  .shoplist-row:last-child{border-bottom:none;}
  .shoplist-row-img{
    width:64px; height:64px;
    border-radius:6px;
    overflow:hidden;
    background:var(--cream);
    border:1px solid var(--card-line);
    flex-shrink:0;
  }
  .shoplist-row-img img{width:100%; height:100%; object-fit:cover; display:block;}
  .shoplist-row-info{flex:1; min-width:0;}
  .shoplist-row-store{
    display:inline-block;
    font-size:10px; font-weight:700; color:#fff;
    padding:2px 7px; border-radius:4px;
    font-family:'Roboto Mono',monospace;
  }
  .shoplist-row-name{
    margin:6px 0 0;
    font-size:14px; font-weight:600; line-height:1.3;
    overflow:hidden; text-overflow:ellipsis;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  }
  .shoplist-row-price{
    font-size:19px; font-weight:900; color:var(--red);
    flex-shrink:0;
  }
  .shoplist-total-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    border-top:2px solid var(--ink);
    margin-top:4px;
    padding-top:16px;
    font-weight:700;
  }
  .shoplist-total-row span:last-child{font-size:24px; font-weight:900; color:var(--red);}
  .shoplist-modal-actions{
    display:flex;
    gap:10px;
    justify-content:center;
    margin-top:20px;
  }
  .shoplist-modal-actions a, .shoplist-modal-actions button{
    font-family:'Noto Sans SC',sans-serif;
    font-weight:700;
    font-size:13px;
    text-decoration:none;
    border-radius:8px;
    padding:10px 20px;
    cursor:pointer;
    border:none;
  }
  .shoplist-close-btn{background:transparent; border:1px solid var(--card-line) !important; color:var(--ink);}
  .shoplist-screenshot-btn{background:var(--gold); color:var(--bg);}
  .shoplist-screenshot-btn:disabled{opacity:0.5; cursor:not-allowed;}

    width:100%; aspect-ratio:1/1;
    border-radius:5px; overflow:hidden;
    background:var(--cream);
  }
  .compare-item-img{
    width:100%;
    aspect-ratio:1/1;
    border-radius:5px;
    overflow:hidden;
    background:var(--cream);
  }
  .compare-item-img img{width:100%; height:100%; object-fit:cover; display:block;}
  .compare-item-store{
    font-family:'Roboto Mono',monospace;
    font-size:10px; font-weight:700;
    color:#fff; background:var(--green);
    display:inline-block; padding:2px 6px; border-radius:4px;
    width:fit-content;
  }
  .compare-item-name{font-size:13px; font-weight:700; margin:0;}
  .compare-item-price{display:flex; align-items:baseline; gap:6px;}
  .compare-item-price .price{font-family:'Archivo Black',sans-serif; font-size:18px; color:var(--red);}
  .compare-item-price .orig{font-size:11px; color:var(--ink-soft); text-decoration:line-through;}
  .compare-item-unit{font-size:11px; color:var(--ink-soft);}
  .item-image{
    width:100%;
    aspect-ratio:1/1;
    border-radius:3px;
    overflow:hidden;
    background:var(--cream);
    border:1px solid var(--card-line);
  }
  .item-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .item-image.no-image{
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--card-line);
    font-size:11px;
    font-family:'Noto Sans SC',sans-serif;
  }
  .item-image.no-image::after{
    content:"暂无图片";
  }
  .store-badge{
    font-family:'Roboto Mono',monospace;
    font-size:11px;
    font-weight:700;
    letter-spacing:.03em;
    padding:3px 8px;
    border-radius:5px;
    color:#fff;
    background:var(--badge-color,var(--green));
  }
  .discount-stamp{
    font-family:'Archivo Black',sans-serif;
    font-size:12px;
    color:var(--red);
    border:2px solid var(--red);
    border-radius:50%;
    width:44px; height:44px;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    line-height:1.05;
    transform:rotate(-8deg);
    flex-shrink:0;
  }
  .item-name{
    font-size:17px;
    font-weight:700;
    font-family:'Noto Sans SC',sans-serif;
    margin:0;
  }
  .item-name-en{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:-6px;
  }
  .price-row{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-top:auto;
  }
  .price{
    font-family:'Roboto Mono',monospace;
    font-size:26px;
    font-weight:700;
    color:var(--red);
  }
  .unit{font-size:12px; color:var(--ink-soft);}
  .orig-price{
    font-family:'Roboto Mono',monospace;
    font-size:13px;
    color:var(--ink-soft);
    text-decoration:line-through;
  }
  .card.clickable{cursor:pointer; transition:transform .12s ease;}
  .card.clickable:hover{transform:translateY(-3px);}
  .valid{
    font-size:11px;
    color:var(--ink-soft);
    font-family:'Roboto Mono',monospace;
    border-top:1px dashed var(--card-line);
    padding-top:8px;
  }
  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--card-line);
  }
  .empty .display{font-size:22px; color:var(--gold); margin-bottom:8px;}

  footer{
    text-align:center;
    padding:24px;
    font-size:12px;
    color:var(--card-line);
    border-top:1px dashed rgba(245,239,224,0.2);
  }
  footer a{color:var(--gold);}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Toronto Grocery Flyers</div>
  <h1>一次搜索，比遍<span>多伦多</span>超市特价</h1>
  <p>Loblaws · No Frills · Longo's · 大统华 T&amp;T · Metro · Galleria</p>
</header>

<div class="search-wrap">
  <div class="search-box">
    <input id="searchInput" type="text" placeholder="搜索：肉 / 菜 / 牛奶 / 鸡蛋 / 海鲜…" autocomplete="off">
    <button id="searchBtn">搜索</button>
  </div>
</div>

<div class="stores-header">
  <button id="selectAllBtn" class="select-all-btn">全选</button>
  <button id="deselectAllBtn" class="select-all-btn">取消全选</button>
</div>
<div class="stores" id="storeFilters"></div>

<div class="stores-header" style="margin-top:10px;">
  <button id="selectAllCategoryBtn" class="select-all-btn">全选</button>
  <button id="deselectAllCategoryBtn" class="select-all-btn">取消全选</button>
</div>
<div class="stores" id="categoryFilters"></div>

<main>
  <div class="results-meta">
    <span id="resultCount">显示全部特价</span>
    <div style="display:flex; align-items:center; gap:10px;">
      <select id="sortSelect" class="sort-select">
        <option value="discount-pct">按折扣力度（默认）</option>
        <option value="discount-amount">按省的钱最多</option>
        <option value="price-asc">价格从低到高</option>
        <option value="price-desc">价格从高到低</option>
        <option value="name-asc">按名称 A-Z</option>
      </select>
      <span id="updatedAt"></span>
    </div>
  </div>
  <div class="grid" id="grid"></div>
</main>

<footer>
  数据来自各超市传单自动抓取，更新频率取决于抓取任务运行的频率 · 项目开源于
  <a href="#" id="repoLink">GitHub</a>
</footer>

<div class="compare-bar" id="compareBar">
  <span class="compare-bar-count" id="compareBarCount">已选 0 个商品</span>
  <div class="compare-bar-actions">
    <button class="compare-bar-clear-btn" id="compareClearBtn">清空</button>
    <button class="compare-bar-view-btn" id="compareViewBtn">查看对比</button>
  </div>
</div>

<div class="compare-modal-overlay" id="compareModalOverlay">
  <div class="compare-modal">
    <div class="compare-modal-header">
      <h2>商品对比</h2>
      <button class="compare-modal-close" id="compareModalCloseBtn">&times;</button>
    </div>
    <div class="compare-grid" id="compareGrid"></div>
    <div class="compare-modal-actions">
      <button class="generate-list-btn" id="generateListBtn">查看购物清单</button>
    </div>
  </div>
</div>

<div class="compare-modal-overlay" id="shoplistModalOverlay">
  <div class="shoplist-modal">
    <div class="compare-modal-header">
      <h2>购物清单</h2>
      <button class="compare-modal-close" id="shoplistCloseBtnX">&times;</button>
    </div>
    <p class="shoplist-date" id="shoplistDate"></p>
    <div class="shoplist-rows" id="shoplistRows"></div>
    <div class="shoplist-total-row">
      <span id="shoplistCount"></span>
      <span id="shoplistTotal"></span>
    </div>
    <div class="shoplist-modal-actions">

"originalPrice": 4.29, "unit": "each", "validFrom": "2026-08-20", "validTo": "2026-08-26"}, {"store": "tnt", "category": "海鲜", "nameZh": "活虾", "nameEn": "Live Shrimp", "price": 8.99, "originalPrice": 12.99, "unit": "/lb", "validFrom": "2026-08-20", "validTo": "2026-08-26"}, {"store": "longos", "category": "海鲜", "nameZh": "三文鱼", "nameEn": "Salmon Fillet", "price": 9.99, "originalPrice": 14.99, "unit": "/lb", "validFrom": "2026-08-21", "validTo": "2026-08-27"}, {"store": "loblaws", "category": "水果", "nameZh": "草莓", "nameEn": "Strawberries", "price": 2.99, "originalPrice": 4.99, "unit": "each", "validFrom": "2026-08-21", "validTo": "2026-08-27"}, {"store": "tnt", "category": "水果", "nameZh": "西瓜", "nameEn": "Watermelon", "price": 0.39, "originalPrice": 0.69, "unit": "/lb", "validFrom": "2026-08-20", "validTo": "2026-08-26"}]};

let DATA = { stores: [], items: [] };
let activeStores = new Set();
let activeCategories = new Set();
let currentQuery = "";
let currentSort = "discount-pct";

// DATA.items 这个数组一旦加载完就不会被重建（render() 只是从里面筛选/
// 排序出子集，筛出来的还是同一批对象），所以用对象引用当 key 完全够用，
// 页面重新渲染（比如换排序、切换筛选）也不会丢失已经选中的状态。
let selectedItems = new Set();

async function loadData(){

    const res = await fetch('data.json', { cache: 'no-store' });

function buildStoreFilters(){
  const wrap = document.getElementById('storeFilters');
  wrap.innerHTML = '';
  DATA.stores.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'store-chip active';
    btn.style.setProperty('--chip-color', s.color);
    btn.textContent = s.nameZh === s.name ? s.name : (s.nameZh + ' ' + s.name);
    btn.dataset.id = s.id;
    btn.addEventListener('click', () => {
      if(activeStores.has(s.id)){
        activeStores.delete(s.id);
        btn.classList.remove('active');
      } else {
        activeStores.add(s.id);
        btn.classList.add('active');

      render();

    wrap.appendChild(btn);

function buildCategoryFilters(){
  // 分类是从数据里动态取出来的，新超市带来的新分类（比如"个护美妆"
  // "家居百货"）会自动出现在这里，不用改代码。
  const cats = [...new Set(DATA.items.map(i => i.category))];
  cats.forEach(c => activeCategories.add(c));  // 默认全部选中，跟现在的体验一致

  const wrap = document.getElementById('categoryFilters');
  wrap.innerHTML = '';
  cats.forEach(c => {

    btn.className = 'category-chip active';

    btn.addEventListener('click', () => {

        btn.classList.remove('active');
      } else {
        activeCategories.add(c);
        btn.classList.add('active');
      }
      render();
    });
    wrap.appendChild(btn);
  });
}

function storeMeta(id){
  return DATA.stores.find(s => s.id === id) || { name:id, nameZh:id, color:'#4A7862' };
}

function matches(item, q){
  if(!q) return true;
  const hay = (item.category + ' ' + item.nameZh + ' ' + item.nameEn).toLowerCase();
  return hay.includes(q.toLowerCase());
}

// 排序方式跟下拉框的 value 一一对应，新增排序方式的话在这里加一个 case
// 再在 <select id="sortSelect"> 里加一个 <option> 就行。
function sortItems(items, sortKey){
  const sorted = [...items];
  switch(sortKey){
    case 'discount-amount':
      sorted.sort((a,b) => (b.originalPrice-b.price) - (a.originalPrice-a.price));
      break;
    case 'price-asc':
      sorted.sort((a,b) => a.price - b.price);
      break;
    case 'price-desc':
      sorted.sort((a,b) => b.price - a.price);
      break;
    case 'name-asc':
      sorted.sort((a,b) => a.nameEn.localeCompare(b.nameEn));
      break;
    case 'discount-pct':
    default:
      sorted.sort((a,b)=> (b.originalPrice-b.price)/b.originalPrice - (a.originalPrice-a.price)/a.originalPrice);
  }
  return sorted;
}

function render(){
  const grid = document.getElementById('grid');
  const q = currentQuery.trim();
  const filtered = DATA.items.filter(i =>
    activeStores.has(i.store) && activeCategories.has(i.category) && matches(i, q)
  );
  const sorted = sortItems(filtered, currentSort);

  document.getElementById('resultCount').textContent = q
    ? `“${q}” 共找到 ${sorted.length} 个特价`
    : `显示全部特价（${sorted.length}）`;

  grid.innerHTML = '';
  if(sorted.length === 0){
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">
      <div class="display">没有找到相关特价</div>
      <div>换个关键词试试，比如“肉”“菜”“牛奶”，或者检查一下上面的分类/店铺筛选是不是选太少了</div>
    </div>`;
    return;
  }

  sorted.forEach(item => {
      const s = storeMeta(item.store);
      const pct = Math.round((1 - item.price/item.originalPrice) * 100);
      const card = document.createElement('div');
      card.className = 'card';
      if(item.url){
        card.classList.add('clickable');
        card.addEventListener('click', () => window.open(item.url, '_blank', 'noopener'));
      }
      const isSelected = selectedItems.has(item);
      card.innerHTML = `
        <div class="card-top">
          <div style="display:flex; align-items:center; gap:8px;">
            <div class="select-checkbox ${isSelected ? 'checked' : ''}" data-select>&#10003;</div>
            <span class="store-badge" style="--badge-color:${s.color}">${s.nameZh}</span>
          </div>
          <div class="discount-stamp">-${pct}%</div>
        </div>
        ${item.image
          ? `<div class="item-image"><img src="${item.image}" alt="" loading="lazy" onerror="this.style.display='none'; this.parentElement.classList.add('no-image');"></div>`
          : `<div class="item-image no-image"></div>`}
        <div>
          <p class="item-name">${item.nameEn}</p>
        </div>
        <div class="price-row">
          <span class="price">$${item.price.toFixed(2)}</span>
          <span class="unit">${item.unit}</span>
          <span class="orig-price">$${item.originalPrice.toFixed(2)}</span>
        </div>
        ${item.validFrom && item.validTo ? `<div class="valid">有效期 ${item.validFrom} ~ ${item.validTo}</div>` : ''}
      `;
      const checkbox = card.querySelector('[data-select]');
      checkbox.addEventListener('click', (e) => {
        e.stopPropagation();  // 别让点击选择框也触发卡片本身"打开链接"的点击事件
        if(selectedItems.has(item)){
          selectedItems.delete(item);
          checkbox.classList.remove('checked');
        } else {
          selectedItems.add(item);
          checkbox.classList.add('checked');
        }
        updateCompareBar();
      });
      grid.appendChild(card);
  });
}

      <button class="compare-item-remove" data-remove>&times;</button>
      ${item.image
        ? `<div class="compare-item-img"><img src="${item.image}" alt="" onerror="this.style.display='none'"></div>`

// ---------- 一键截图：用屏幕捕获 API，不是画 Canvas ----------
// 跟 html2canvas 那条路完全不同的技术——捕获的是"屏幕上已经渲染出来的
// 像素"（跟人眼看到的一样），不是去读图片元素背后的原始数据，所以不会
// 撞上跨域图片没法导出这堵墙。代价：
//   1. 必须是 HTTPS（或 localhost）环境，file:// 本地打开用不了。
//   2. 每次都会弹出浏览器自己的"选择要共享的窗口"确认框，这是浏览器
//      强制要求的，没法跳过或者自动选。
async function captureShoplistScreenshot(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia){
    alert('当前环境不支持一键截图（可能不是 HTTPS 环境，或者浏览器不支持），'
          + '改用系统自带的截图工具手动截这个窗口吧。');
    return;
  }

  const btn = document.getElementById('shoplistScreenshotBtn');
  const modal = document.querySelector('#shoplistModalOverlay .shoplist-modal');
  let stream = null;

  try {
    btn.disabled = true;
    btn.textContent = '请在弹窗里选择这个窗口…';

    stream = await navigator.mediaDevices.getDisplayMedia({
      video: { displaySurface: 'window' },
      preferCurrentTab: true,       // Chrome 支持的话会建议默认选中当前标签页，减少选错的可能；不支持的浏览器会忽略这个选项
      selfBrowserSurface: 'include',
    });

    const video = document.createElement('video');
    video.srcObject = stream;
    video.muted = true;
    await video.play();

    await new Promise(resolve => {
      if(video.readyState >= 2) resolve();
      else video.onloadeddata = resolve;
    });
    await new Promise(resolve => setTimeout(resolve, 300));  // 等画面稳定下来

    // 算购物清单弹窗在屏幕上的位置，从截到的整个窗口画面里裁出这一块。
    // 视频捕获的分辨率跟网页的 CSS 像素坐标不一定是1:1（受屏幕缩放比例
    // 影响），按视频实际尺寸跟浏览器可视区域尺寸的比例换算一下，裁切
    // 位置才准。
    const rect = modal.getBoundingClientRect();
    const scaleX = video.videoWidth / window.innerWidth;
    const scaleY = video.videoHeight / window.innerHeight;

    const cropX = rect.left * scaleX;
    const cropY = rect.top * scaleY;
    const cropW = rect.width * scaleX;
    const cropH = rect.height * scaleY;

    const canvas = document.createElement('canvas');
    canvas.width = cropW;
    canvas.height = cropH;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

    stream.getTracks().forEach(t => t.stop());
    stream = null;

    const dataUrl = canvas.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = '购物清单.png';
    a.click();

  } catch(e) {
    if(e.name === 'NotAllowedError'){
      console.log('[shoplist] 用户取消了截图授权，不算错误');
    } else {
      console.error('[shoplist] 截图失败：', e);
      alert('截图失败，改用系统自带的截图工具手动截这个窗口吧。');
    }
  } finally {
    if(stream) stream.getTracks().forEach(t => t.stop());
    btn.disabled = false;
    btn.textContent = '一键截图保存';
  }
}

document.getElementById('shoplistScreenshotBtn').addEventListener('click', captureShoplistScreenshot);
document.getElementById('compareViewBtn').addEventListener('click', openCompareModal);
document.getElementById('compareModalCloseBtn').addEventListener('click', closeCompareModal);
document.getElementById('compareModalOverlay').addEventListener('click', (e) => {
  if(e.target.id === 'compareModalOverlay') closeCompareModal();  // 点弹窗外围空白处也能关掉
});
document.getElementById('compareClearBtn').addEventListener('click', () => {
  selectedItems.clear();
  shoppingListItems.clear();  // 之前这里漏了，导致"清空"之后购物清单里的旧勾选还残留着
  updateCompareBar();
  render();
});
document.getElementById('generateListBtn').addEventListener('click', openShoppingListModal);
document.getElementById('shoplistCloseBtn').addEventListener('click', closeShoppingListModal);
document.getElementById('shoplistCloseBtnX').addEventListener('click', closeShoppingListModal);
document.getElementById('shoplistModalOverlay').addEventListener('click', (e) => {
  if(e.target.id === 'shoplistModalOverlay') closeShoppingListModal();
});

loadData();
</script>
