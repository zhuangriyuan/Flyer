name: Update Flyer Prices

on:
  schedule:
    - cron: "0 13 * * *"   # 每天 UTC 13:00 跑一次（约北美东部早上8-9点），可以自己改
  workflow_dispatch:        # 允许在网页上手动点按钮触发

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          pip install requests beautifulsoup4 curl_cffi playwright
          playwright install --with-deps chromium

      - name: Scrape all stores and update data.json
        env:
          TNT_COOKIE: ${{ secrets.TNT_COOKIE }}
        run: python run_all.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Auto-update flyer data $(date -u +%Y-%m-%d)"
          git push
